<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Feed the Ducks</title>

    <!-- Normalize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <!-- Style Sheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <header>
            <h1>Don't Feed the Ducks.</h1>
            <nav>
                <button>New Game</button>
                <button>How to Play</button>
            </nav>
        </header>

        <main>
            <div id="score">
                <div id="duckscore">
                    <p class="player">Duck</p>
                    <div>
                        <img src="images/bread.png" alt="bread icon">
                        <p class="score">00</p>
                    </div>
                    
                </div>

                <div id="pigeonscore">
                    <p class="player">Pigeon</p>
                    <div>
                        <img src="images/bread.png" alt="bread icon">
                        <p class="score">00</p>
                    </div>
                    
                </div>
            </div>
        
            <div id="players">
                <img src="images/duck.png" alt="Duck">
                <img src="images/pigeon.png" alt="Pigeon">
            </div>

            <div id="dice">
                <img src="images/dice.png" alt="dice">
                <img src="images/dice.png" alt="dice">
            </div>

            <div id="actions">
                <button>Feed</button>
                <button>Pass</button>
            </div>

            <div id="instructions">
                <img src="images/instructions.png" alt="How to Play">

            </div>

        </main>
    </div>
</body>
</html>
